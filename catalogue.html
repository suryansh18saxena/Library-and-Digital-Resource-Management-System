<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue | GLA Central Library</title>
<link rel="icon" href="img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header id="siteHeader" class="sticky-top"></header>

<main id="main">

<section class="py-4 bg-white border-bottom">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small mb-2">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Catalogue</li>
      </ol>
    </nav>
    <h1 class="h3">Book Catalogue</h1>
    <p class="text-muted-soft" style="max-width:65ch">Browse the physical books held in the library. Use the filters to narrow results by category, availability or language.</p>

    <form class="input-group mt-3" style="max-width:640px" id="searchForm" role="search">
      <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
      <input type="search" class="form-control" id="searchInput" placeholder="Search by title, author, ISBN or tag" aria-label="Search books">
      <button class="btn btn-navy" type="submit">Search</button>
    </form>
  </div>
</section>

<section class="py-4 py-lg-5">
  <div class="container">
    <div class="row g-4">

      <aside class="col-lg-3">
        <button class="btn btn-outline-secondary w-100 d-lg-none mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#filterBox" aria-expanded="false" aria-controls="filterBox">
          <i class="bi bi-funnel me-1"></i> Show filters
        </button>
        <div class="collapse d-lg-block" id="filterBox">
          <div class="card filter-card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 mb-0">Filters</h2>
                <button class="btn btn-link btn-sm text-decoration-none p-0" type="button" id="resetBtn">Reset</button>
              </div>

              <h3 class="text-uppercase text-muted-soft fw-bold mb-2" style="font-size:.72rem;letter-spacing:.05em">Category</h3>
              <div id="categoryFilters" class="mb-4"></div>

              <h3 class="text-uppercase text-muted-soft fw-bold mb-2" style="font-size:.72rem;letter-spacing:.05em">Availability</h3>
              <div id="statusFilters" class="mb-4"></div>

              <h3 class="text-uppercase text-muted-soft fw-bold mb-2" style="font-size:.72rem;letter-spacing:.05em">Language</h3>
              <div id="languageFilters"></div>
            </div>
          </div>
        </div>
      </aside>

      <div class="col-lg-9">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <span class="text-muted-soft small" id="resultCount" aria-live="polite"></span>
          <select class="form-select w-auto" id="sortSelect" aria-label="Sort books">
            <option value="relevance">Sort by: Relevance</option>
            <option value="title">Sort by: Title (A-Z)</option>
            <option value="newest">Sort by: Newly Added</option>
            <option value="rating">Sort by: Rating</option>
            <option value="available">Sort by: Most Available</option>
          </select>
        </div>

        <div class="row g-4" id="bookGrid"></div>

        <nav class="mt-4 d-flex justify-content-center" aria-label="Catalogue pages">
          <ul class="pagination mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>
</section>

</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/catalogue.js"></script>
</body>
</html>
