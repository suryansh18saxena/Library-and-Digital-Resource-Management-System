<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard | GLA Central Library</title>
<link rel="icon" href="img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header id="siteHeader" class="sticky-top"></header>

<main id="main">
<section class="py-4 py-lg-5">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small mb-3">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">My Dashboard</li>
      </ol>
    </nav>

    <div class="welcome-banner mb-4" id="welcomeBanner"></div>

    <div class="row g-4">

      <div class="col-lg-3">
        <div class="card profile-card">
          <div class="card-body text-center" id="profileCard"></div>
        </div>
      </div>

      <div class="col-lg-9">
        <div class="row g-3 mb-4" id="statRow"></div>

        <div id="overdueAlert"></div>

        <div class="card section-card mb-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
              <h2 class="section-title"><i class="bi bi-journal-bookmark"></i> Currently Issued Books</h2>
              <a href="catalogue.html" class="btn btn-outline-secondary btn-sm">Find a Book</a>
            </div>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Book</th>
                    <th>Issued On</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Fine</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="issuedRows"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card section-card mb-4">
          <div class="card-body">
            <h2 class="section-title mb-3"><i class="bi bi-hourglass-split"></i> My Book Requests</h2>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Book</th>
                    <th>Requested On</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="requestRows"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card section-card mb-4">
          <div class="card-body">
            <h2 class="section-title mb-3"><i class="bi bi-clock-history"></i> Transaction History</h2>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Book</th>
                    <th>Issued On</th>
                    <th>Returned On</th>
                    <th>Fine</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="historyRows"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card section-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
              <h2 class="section-title"><i class="bi bi-bookmark-star"></i> Saved Digital Resources</h2>
              <a href="digital-resources.html" class="btn btn-outline-secondary btn-sm">Browse More</a>
            </div>
            <div class="row g-3" id="savedResources"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
