<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Resources | GLA Central Library</title>
<link rel="icon" href="img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header id="siteHeader" class="sticky-top"></header>

<main id="main">

<section class="py-4 bg-white border-bottom">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small mb-2">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Digital Resources</li>
      </ol>
    </nav>
    <h1 class="h3">Digital Resources</h1>
    <p class="text-muted-soft" style="max-width:65ch">E-books, research papers, journals and web references. Open access material is free for everyone; subscription material needs a member login.</p>

    <div class="input-group mt-3" style="max-width:640px">
      <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
      <input type="search" class="form-control" id="resSearch" placeholder="Search e-books, papers and journals" aria-label="Search resources">
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3" id="typeTabs" role="group" aria-label="Filter by type"></div>
  </div>
</section>

<section class="py-4 py-lg-5">
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <span class="text-muted-soft small" id="resCount" aria-live="polite"></span>
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <div class="form-check form-switch mb-0 me-2">
          <input class="form-check-input" type="checkbox" role="switch" id="openOnly">
          <label class="form-check-label small" for="openOnly">Open access only</label>
        </div>
        <div class="form-check form-switch mb-0 me-2" id="savedOnlyWrap" hidden>
          <input class="form-check-input" type="checkbox" role="switch" id="savedOnly">
          <label class="form-check-label small" for="savedOnly">My saved</label>
        </div>
        <select class="form-select w-auto" id="resSort" aria-label="Sort resources">
          <option value="popular">Sort by: Most Accessed</option>
          <option value="newest">Sort by: Newest</option>
          <option value="title">Sort by: Title (A-Z)</option>
        </select>
      </div>
    </div>

    <div class="row g-4" id="resourceGrid"></div>
  </div>
</section>

</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/resources.js"></script>
</body>
</html>
